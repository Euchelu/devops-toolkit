name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check app/ tests/

  # ── JOB 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # Solo corre si lint pasa

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ── JOB 3: Docker build ──────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test  # Solo corre si los tests pasan

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-toolkit:${{ github.sha }} .

      - name: Verify image runs
        run: docker run --rm devops-toolkit:${{ github.sha }}

  # ── JOB 4: Deploy (simulado) ─────────────────────────────────────────────────
  deploy:
    name: Deploy to production (simulated)
    runs-on: ubuntu-latest
    needs: docker  # Solo corre si docker build pasa
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Simulate deploy
        run: |
          echo "✅ All checks passed"
          echo "🐳 Docker image: devops-toolkit:${{ github.sha }}"
          echo "🚀 Deploying to production..."
          echo "✅ Deploy complete — $(date)"
